name: keepalive
# GitHub delays scheduled runs by hours, so each run stays alive for ~5h50m and pings every 4 minutes.
on:
  schedule: [{ cron: "0 */5 * * *" }]
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - run: |
          end=$(( $(date +%s) + 350*60 ))
          while [ $(date +%s) -lt $end ]; do
            curl -fsS --max-time 90 https://tessera-core.onrender.com/health -o /dev/null && echo "ok $(date -u +%H:%M)" || echo "miss $(date -u +%H:%M)"
            sleep 240
          done
