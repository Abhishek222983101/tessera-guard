[project]
name = "tessera"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115","uvicorn[standard]>=0.30","pydantic>=2.8","pyjwt>=2.9","pyyaml>=6","pymupdf>=1.24","rapidfuzz>=3.9","pynacl>=1.5","numpy>=1.26","reportlab>=4.2","beautifulsoup4>=4.12","sse-starlette>=2.1","cedarpy>=4.0","python-multipart>=0.0.9","httpx>=0.27"]
[dependency-groups]
dev = ["pytest>=8","hypothesis>=6","pytest-asyncio>=0.23"]
[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["."]
